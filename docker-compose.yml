services:
  db:
    image: postgres:17
    restart: always
    ports:
      - "5430:5432"
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    image: odoo:18
    restart: always
    depends_on:
      - db
    ports:
      - "8070:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
    volumes:
      - ./custom_addons:/mnt/extra-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf

volumes:
  postgres_data: